name: Validate LedgerLens
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: ledgerlens, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: ledgerlens}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ledgerlens" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      INTERNAL_SERVICE_SECRET: ci-only-service-secret
      DATABASE_URL: postgresql://ledgerlens:ci-only-password@localhost:5432/ledgerlens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r reconciliation-service/requirements.txt
      - run: ruff check reconciliation-service
      - run: python manage.py makemigrations --check --dry-run
        working-directory: reconciliation-service
      - run: python manage.py test tests
        working-directory: reconciliation-service
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: node scripts/init-env.mjs
      - run: docker compose up --build --wait --wait-timeout 240
      - run: docker compose exec -T server node server/dist/seed.js
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env: {BASE_URL: 'http://localhost:8080'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-verification, path: 'test-results/'}
      - run: docker compose logs --no-color --tail 100
        if: failure()
      - run: docker compose down -v
        if: always()
